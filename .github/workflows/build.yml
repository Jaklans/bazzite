name: build
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  schedule:
    - cron: '20 */6 * * *'  # rebuild only when the Bazzite base moved (see "check")
  workflow_dispatch:

env:
  BASE: ghcr.io/ublue-os/bazzite-deck-nvidia:stable
  IMAGE: ghcr.io/jaklans/bazzite-deck-nvidia

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check base
        id: check
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$BASE")
          version=$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://${BASE%:*}@$digest")
          echo "base $digest ($version)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "fedora=${version%%.*}" >> "$GITHUB_OUTPUT"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            ours=$(skopeo inspect "docker://$IMAGE:latest" 2>/dev/null \
              | jq -r '.Labels["org.opencontainers.image.base.digest"] + " " + .Labels["org.opencontainers.image.revision"]' || true)
            [ "$ours" = "$digest $GITHUB_SHA" ] && build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build: $build"

      - name: Maximize build space
        if: steps.check.outputs.build == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build
        if: steps.check.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.check.outputs.digest }}
          VERSION: ${{ steps.check.outputs.version }}
          FEDORA: ${{ steps.check.outputs.fedora }}
        run: |
          set -euxo pipefail
          podman build \
            --build-arg "BASE_IMAGE=${BASE%:*}@$DIGEST" \
            --build-arg "FEDORA=$FEDORA" \
            --tag "$IMAGE:latest" --tag "$IMAGE:$VERSION" \
            --file Containerfile .
          podman run --rm --entrypoint rpm "$IMAGE:latest" -q NetworkManager

      # Rewrite as a chunked ostree image with SELinux labels baked in, like stock Bazzite.
      # A plain derived layer gets relabeled on the client from the new image's policy, and
      # the client's older loaded policy rejects any new types (fsetxattr EINVAL on switch).
      - name: Rechunk
        if: steps.check.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.check.outputs.digest }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euxo pipefail
          graphroot=$(podman info --format '{{.Store.GraphRoot}}')
          # The chunker writes a fresh config, so labels go here.
          args=(
            --label "org.opencontainers.image.base.name=$BASE"
            --label "org.opencontainers.image.base.digest=$DIGEST"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.url=https://github.com/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.title=bazzite-deck-nvidia (NM wake patch)"
            --label "org.opencontainers.image.description=Bazzite deck-nvidia with NetworkManager patched to keep WoWLAN wifi up across suspend"
            --label "org.opencontainers.image.version=$VERSION"
            --label "ostree.bootable=true"
          )
          # Keep the previous build's layer plan so updates only fetch changed chunks.
          if skopeo inspect --raw "docker://$IMAGE:latest" >/dev/null 2>&1; then
            args+=(--previous-build "docker://$IMAGE:latest")
          fi
          # The chunker runs inside the new image, whose policy wants signatures on our repo. The
          # previous build only steers the layer plan, so don't make it a reason to fail.
          echo '{"default":[{"type":"insecureAcceptAnything"}]}' > /tmp/rechunk-policy.json
          podman run --rm --pull=never --privileged \
            -v /tmp/rechunk-policy.json:/etc/containers/policy.json:ro \
            --mount=type=image,src="$IMAGE:latest",target=/rpm-ostree \
            --mount=type=bind,src="$graphroot",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            "$IMAGE:latest" \
            compose build-chunked-oci \
            --max-layers 127 --format-version=2 --bootc "${args[@]}" \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]$IMAGE:latest"
          podman tag "$IMAGE:latest" "$IMAGE:$VERSION"
          podman inspect "$IMAGE:latest" --format '{{index .Labels "org.opencontainers.image.base.digest"}} {{index .Labels "org.opencontainers.image.version"}}'

      - name: Push
        id: push
        if: steps.check.outputs.build == 'true' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Push once and copy the tag: a second podman push recompresses and gets a new
          # digest, which the signature below wouldn't cover.
          podman push --digestfile=/tmp/digest "$IMAGE:$VERSION"
          digest=$(< /tmp/digest)
          skopeo copy --preserve-digests --dest-creds "$GITHUB_ACTOR:$TOKEN" \
            "docker://$IMAGE@$digest" "docker://$IMAGE:latest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Sign
        if: steps.push.outcome == 'success'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          DIGEST: ${{ steps.push.outputs.digest }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Old bundle format: rpm-ostree/containers-image can't read the new one yet
          # (containers/container-libs#388, coreos/rpm-ostree#5509).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          [ "$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")" = "$DIGEST" ]
          cosign verify --key cosign.pub "$IMAGE:latest" > /dev/null
